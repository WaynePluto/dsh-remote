# CI：每次 push / PR 跑 lint、build、typecheck、test、依赖版本检查。
# 双平台矩阵：项目面向 Windows 被控机开发（托盘、taskkill、路径处理），
# 但 relay 部署在 Linux 上，两边都得绿。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 本地不强制 pnpm 版本；CI 固定版本以保持依赖安装可复现。
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # husky 的 prepare 钩子在 CI 里无害（.git 由 checkout 提供）
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      # plugin-ui 根导出的类型指向 dist/index.d.ts，services 等依赖包
      # 要先有构建产物才能解析到类型，所以 build 必须在 typecheck 之前
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:dependencies
