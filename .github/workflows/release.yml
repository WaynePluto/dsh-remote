# Release：推 v* 标签时打出全部发行介质并附到 GitHub Release。
#
#   示例：git tag v0.0.1 && git push origin v0.0.1
#
# 介质矩阵（D21/D22，四个发布端 × lite/full）：
#   - win / mac / linux 桌面版：setup（win NSIS setup.exe / mac DMG / linux deb）
#     加 portable 便携 zip。桌面壳依赖系统 WebView/CGO，不支持交叉编译，
#     由三个原生 runner 分别执行 node scripts/release.mjs --target=<平台>
#     （一次构建出 lite/full 双变体；本地只需单变体时用 release:<平台>:<lite|full> 命令）。
#   - Linux 服务版 zip：随 linux 作业一起产出，始终用系统 Node。
# 也支持 workflow_dispatch 手动触发（只上传 artifact、不创建 Release），
# 用来调试打包流程。
#
# 前置条件：tag 必须与 packages/launcher/package.json 的 version 一致
# （产物文件名里的版本号取自那里，不一致等于发错货）。
# 还要有 docs/changelog/<版本>.md（Release 正文取自它，见 CHANGELOG.md）。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 发布端 1/4：Windows 桌面版（NSIS setup.exe + 便携 zip，lite/full）。
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/desktop/go.mod
      # NSIS 用于出安装包；没有它只会产出便携 zip 并响亮提示。
      - run: choco install nsis -y --no-progress
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs --target=win32-x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: release/dsh-station-*
          if-no-files-found: error

  # 发布端 2/4：macOS 桌面版（.app 便携 zip + DMG，lite/full）。
  # 未签名/未公证，实机验收见计划 S10。
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/desktop/go.mod
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs --target=darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/dsh-station-*
          if-no-files-found: error

  # 发布端 3/4 + 4/4：Linux 桌面版（deb + 便携 zip）与服务版 zip，均 lite/full。
  # Wails v2 在 Linux 依赖 WebKitGTK 4.0 开发文件；runner 固定 22.04 保住 4.0。
  # tag 与版本一致性校验也在这条作业里做。
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/desktop/go.mod
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - name: 校验 tag 与版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/launcher/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 packages/launcher/package.json 的 version $pkg 不一致"
            exit 1
          fi
      - run: node scripts/release.mjs --target=linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/dsh-station-*
          if-no-files-found: error

  # 汇总发布：合并三路 artifact、生成校验和并创建 Release。
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [win, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇集介质并生成校验和
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.deb' -o -name '*.dmg' \) -exec cp {} release/ \;
          cd release && sha256sum * > checksums.txt && cat checksums.txt
      - name: 准备 Release 说明
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          notes="docs/changelog/${tag}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::缺少 docs/changelog/${tag}.md；发布前先写好该版本的更新说明并把版本加进 CHANGELOG.md"
            exit 1
          fi
          {
            cat "$notes"
            printf '\n---\n完整更新历史: https://github.com/%s/blob/%s/CHANGELOG.md\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # 版本号带 '-'（如 0.1.0-rc.1）自动标记为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*
