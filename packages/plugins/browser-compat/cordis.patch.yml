# dsh-remote 的受管 Bundle patch 层；package.json 的 dsh.bundle.patch 指向本文件，
# 由 profile 的 bundles 数组装载（层序：Bundle → profile patch → home patch → --patch）。
#
# profile 属于用户，launcher 只在 profile 不存在时写模板，因此插件不能改用户的
# cordis.patch.yml；本层在 profile patch 之下，用户自己的 patch 可以覆盖这里的行为。
# `./` insert 名字由 dsh 锚定本文件目录并转成 file:// URL，故必须使用相对路径，不能写绝对路径。
#
# 无 id 的 insert 由 `applyEntryPatches` 追加到条目表末尾；它只订阅每次渲染
# index.html 时收集的事件表，所以加载顺序不影响结果。
- insert:
    - name: './dist/index.js'
