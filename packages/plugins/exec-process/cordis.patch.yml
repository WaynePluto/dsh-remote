# dsh-remote 的受管 Bundle patch 层；package.json 的 dsh.bundle.patch 指向本文件，
# 由 profile 的 bundles 数组装载（层序：Bundle → profile patch → home patch → --patch）。
#
# `./` 开头的 insert 名字由 dsh 锚定到本文件目录再转成 file:// URL，
# 所以这里只写相对路径（铁律 D17）。
#
# 全部行为在浏览器半 `dist/client.js`；宿主半 `dist/index.js` 仅让 dsh
# 沿 insert 路径找到 package.json，读取 `dsh.client` 与 `exports["./client"]`。
# **dist/client.js 缺失会让 dsh 的 web UI 启动失败**，不是静默降级。
# 顺序不影响：本插件在 `conversation.chat.node` keyed 槽以 priority
# 影子覆盖 dsh 的 `turn-process` 条目，注册顺序不会改变结果。
- insert:
    - id: exec-process
      name: './dist/index.js'
