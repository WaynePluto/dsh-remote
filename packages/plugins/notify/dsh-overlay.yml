# dsh-remote 的 dsh 插件叠加层，由 launcher 用 `dsh --patch <这个文件>` 传给 dsh。
#
# `id` 让后续 `--patch` 可按 id 覆盖 config；本插件没有 config，开关写入
# 「设置 → 通知」的 `dsh-plugin-notify` settings namespace。
#
# 双面插件：insert 加载宿主半 `dist/index.js`；dsh 客户端模块系统依据
# `dsh.client` 与 `exports["./client"]` 下发 `dist/client.js`。
# **dist/client.js 缺失会让 dsh 启动失败**，不是静默降级。
# `approval/request` 与 `user-questions/request` 只观察并 `await next()`；
# `prepend: true` 必须先于不调用 `next()` 的应答者，overlay 行序不影响注册结果。
- insert:
    - id: notify
      name: './dist/index.js'
