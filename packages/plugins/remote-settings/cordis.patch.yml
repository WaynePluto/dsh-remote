# dsh-remote 的受管 Bundle patch 层；package.json 的 dsh.bundle.patch 指向本文件，
# 由 profile 的 bundles 数组装载（层序：Bundle → profile patch → home patch → --patch）。
#
# 自 remote-privileged 拆出的 ownsHost 部分；connection 的 webServer 注入留在
# 壳级常驻 overlay（不可停），那不是本 Bundle 的职责。
#
# `./` insert 名字由 dsh 锚定本文件目录并转成 file:// URL，故必须使用相对路径，不能写绝对路径。
# id 必须稳定：Profile HMR 会重新解析全部 Bundle，匿名行会获得新随机 id 并被误判为新条目。
# 本插件只订阅每次渲染 index.html 时收集的事件表，所以加载顺序不影响结果。
- insert:
    - id: remote-settings
      name: './dist/index.js'
