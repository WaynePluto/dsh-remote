# dsh-remote 的受管 Bundle patch 层；package.json 的 dsh.bundle.patch 指向本文件，
# 由 profile 的 bundles 数组装载（层序：Bundle → profile patch → home patch → --patch）。
#
# 形态与兄弟双面插件相同：`./` insert 名字由 dsh 锚定到本文件目录再转成 file:// URL，
# 所以这里只写相对路径（铁律 D17）。
#
# 宿主半 `dist/index.js` 注册 services 的 tools/RPC；浏览器半 `dist/client.js` 向
# `conversation.input.dock` list 槽添加条目。**dist/client.js 缺失会让 dsh 启动失败**。
# 顺序无关：宿主半只注册工具和通道，浏览器半的条目位置由 `register` 的 `order` 决定。
- insert:
    - id: services
      name: './dist/index.js'
