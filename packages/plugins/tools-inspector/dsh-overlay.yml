# dsh-remote 的 dsh 插件叠加层，由 launcher 用 `dsh --patch <这个文件>` 传给 dsh。
#
# `./` insert 名字由 dsh 锚定到本文件目录再转成 file:// URL，故这里只写相对路径（D17）。
#
# 宿主半 `dist/index.js` 读取 `ctx.tools.schemas(agent)` 与历史调用次数，经
# `/tools-inspector` RPC 交给页面；浏览器半 `dist/client.js` 注册「工具」tab。
# **dist/client.js 缺失会让 dsh 的 web UI 启动失败**，不是静默降级。
# 顺序无关：tab 位置由 `register` 的 `order` 决定，不由 overlay 行序决定。
- insert:
    - id: tools-inspector
      name: './dist/index.js'
