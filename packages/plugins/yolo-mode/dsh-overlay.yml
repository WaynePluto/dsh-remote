# dsh-remote 的固定 YOLO 叠加层，由 launcher 以 --patch 传给 dsh。
#
# 这份 overlay 必须是普通插件 overlay 列表的最后一项：它把部署默认固定为
# full-access + ask，并禁用会误导用户的权限选择器。`config` 是整段替换，
# sandbox-policy 的 workspaceRoot 不能省略。
#
# `./dist/index.js` 是相对 overlay 文件的路径，dsh 会在加载时锚定它；不要写
# 开发机绝对路径，也不要把这份 patch 写进用户的 profile 或 DSH_HOME。
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

# `never` 的含义是自动拒绝，不是自动允许；YOLO answerer 必须收到请求。
- id: approval
  config:
    policy: ask

# YOLO 接管权限策略，不再给用户展示实际无效的权限选择。
- id: permission
  disabled: true

- id: ui-permission
  disabled: true

- insert:
    - id: yolo-mode
      name: './dist/index.js'
