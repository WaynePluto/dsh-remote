packages:
  - 'packages/*'
  # dsh 的扩展一律做成插件（dsh 官方推荐的扩展方式），全部放在这一层。
  - 'packages/plugins/*'

# dsh 的 profile fallback 从应用包的逻辑安装路径遍历依赖闭包，要求
# node_modules 使用扁平布局；isolated linker 只会因历史 hoist 残留而偶然可用。
nodeLinker: hoisted

# pnpm 10 起默认不执行依赖的构建脚本，需要显式放行。
# 只放行确实需要的，避免绿色包引入编译工具链依赖。
onlyBuiltDependencies: []
# pnpm 11+ 用 allowBuilds 表达同一套默认拒绝策略。保持这些包为 false，
# 使全新安装不会弹出 approve-builds 提示，也不会在非交互终端失败；它们的安装脚本
# 都不属于绿色包契约。
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  esbuild: false
  koffi: false
  node-pty: false
  protobufjs: false

# pnpm 11+ 默认启用发布时间门槛。选定的 dsh alpha 属于显式批准的依赖族；
# 其他包继续保留该门槛。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh'
  - '@deepseek-ai/dsh-*'
  - '@deepseek-ai/node-addon-system@0.1.2'
  - '@deepseek-ai/node-addon-system-darwin-arm64@0.1.2'
  - '@deepseek-ai/node-addon-system-linux-x64@0.1.2'
  - 'obug@2.2.0'

# pnpm 10 的 workspace 设置；package.json 不再承载这些键。
supportedArchitectures:
  os: [win32, linux, darwin]
  cpu: [x64, arm64]
  libc: [glibc]
ignoredOptionalDependencies:
  - "*darwin-x64*"
  - "*linux-arm64*"
  - "*musl*"
  - "*win32-arm64*"
# 覆盖版本只维护在根 package.json 的 pnpm.overrides，避免开发运行时混装 dsh 子包。
